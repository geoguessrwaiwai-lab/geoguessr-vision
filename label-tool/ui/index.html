<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>Camera Generation / Feature Labeler</title>
<style>
  :root {
    --bg: #14161a; --panel: #1e2127; --border: #333844; --text: #e6e8eb; --muted: #9aa1ac;
    --accent: #4f8cff; --good: #3ecf7e;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, "Hiragino Kaku Gothic ProN", sans-serif; }
  header { padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  header .meta { color: var(--muted); font-size: 13px; }
  main { padding: 16px; width: 100%; }
  .layout { display: flex; flex-direction: column; gap: 16px; }
  .top { display: flex; align-items: stretch; gap: 12px; }
  .images { flex: 2; min-width: 0; display: flex; flex-direction: column; gap: 12px; }
  .primary-views { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  figure { margin: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; overflow: hidden; }
  .secondary-views { max-width: 320px; }
  figure.watermark img { image-rendering: auto; }
  figure img { width: 100%; display: block; background: #000; }
  figcaption { padding: 6px 10px; font-size: 12px; color: var(--muted); display: flex; justify-content: space-between; }
  .streetview-embed { flex: 1; min-width: 0; border: 0; border-radius: 8px; background: var(--panel); }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 14px; }
  .row { display: flex; flex-direction: row; align-items: center; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .row label.title { width: 140px; flex-shrink: 0; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: 0.03em; }
  .row .opts { display: flex; flex-wrap: wrap; gap: 6px; }
  button.opt { background: #2a2e37; border: 1px solid var(--border); color: var(--text); padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  button.opt:hover { background: #333846; }
  button.opt.selected { background: var(--accent); border-color: var(--accent); color: white; }
  button.opt kbd { opacity: 0.6; margin-left: 4px; font-size: 11px; }
  input[type=text] { background: #14161a; border: 1px solid var(--border); color: var(--text); padding: 8px; border-radius: 6px; flex: 1; min-width: 220px; }
  .actions { display: flex; flex-direction: row; gap: 10px; margin-top: 16px; }
  .actions button { padding: 10px 16px; border-radius: 6px; border: none; font-size: 14px; cursor: pointer; }
  .btn-save { background: var(--good); color: #062; font-weight: 600; }
  .btn-skip { background: #444; color: var(--text); }
  .btn-reject { background: #4a2020; color: #ff9b9b; border: 1px solid #7a3030; }
  .btn-nav { background: #2a2e37; color: var(--text); }
  .progress { font-size: 13px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
  .done-banner { text-align: center; padding: 60px 20px; color: var(--muted); }
</style>
</head>
<body>
<header>
  <div><strong id="modelName">Camera Generation / Feature Labeler</strong></div>
  <div class="meta" id="meta"></div>
  <div class="progress" id="progress"></div>
</header>
<main id="main">Loading...</main>

<script>
let items = [];
let labels = {};
let idx = 0;

// GENS/COLOR_GENSは/api/config(<dataDir>/model.json)から読み込む — データフォルダを
// モデルごとに分ける運用にしたので、どの世代を選択肢に出すかもモデルごとに変わる。
// load()内で実際の値に差し替えられるまでのプレースホルダ。
let GENS = [];
let COLOR_GENS = new Set();
let COLLECT_WATERMARK = true;
const VIEWS = [['front', 'Front (F)'], ['back', 'Back (B)'], ['both', 'Both (O)'], ['neither', 'Neither (N)']];
const COLORS = ['White', 'Blue', 'Blue Striped', 'Silver', 'Grey', 'Black', 'Black Striped', 'Red', 'Navy', 'Other'];

function normalizeLegacyLabel(entry) {
  if (!entry) return entry;
  if (entry.gen === 'Small cam') {
    entry = { ...entry, gen: 'Smallcam', carView: null, color: null, colorCustom: '' };
  }
  if (entry.gen === 'Gen4' && Array.isArray(entry.features) && entry.features.some((f) => f === 'smallcam' || f === 'Smallcam')) {
    entry = { ...entry, gen: 'Smallcam', carView: null, color: null, colorCustom: '' };
  }
  return entry;
}

function isComplete(entry) {
  entry = normalizeLegacyLabel(entry);
  if (!entry) return false;
  if (entry.skipped || entry.rejected) return true;
  if (!GENS.includes(entry.gen)) return false;
  if (!COLOR_GENS.has(entry.gen)) return true;
  if (!VIEWS.some(([view]) => view === entry.carView)) return false;
  return entry.carView === 'neither' || !!entry.color;
}

async function load() {
  const config = await (await fetch('/api/config')).json();
  GENS = config.generations;
  COLOR_GENS = new Set(config.colorGens ?? []);
  COLLECT_WATERMARK = config.collectWatermark ?? true;
  document.getElementById('modelName').textContent = config.name;
  document.title = config.name;
  items = await (await fetch('/api/items')).json();
  labels = await (await fetch('/api/labels')).json();
  for (const panoId of Object.keys(labels)) labels[panoId] = normalizeLegacyLabel(labels[panoId]);
  idx = items.findIndex(it => !isComplete(labels[it.panoId]));
  if (idx === -1) idx = 0;
  render(true);
}

function state() {
  const it = items[idx];
  const existing = labels[it.panoId] || {};
  return { it, existing };
}

let current = {};

function resetCurrent(existing, it) {
  existing = normalizeLegacyLabel(existing) || {};
  // Gen2とGen3はresolutionHeightだけでは区別できない(README参照)ので、あえて
  // デフォルト選択を出さない — 事前サジェストがあるとラベラーがアンカリングされ、
  // 画像を見ずにデフォルトのまま保存してしまうリスクがある。
  const gen = existing.gen || null;
  current = {
    gen,
    carView: existing.carView || (gen === 'Gen4' ? 'front' : null),
    color: existing.color || 'Black',
    colorCustom: existing.colorCustom || '',
    confidence: existing.confidence || 'high',
    notes: existing.notes || '',
  };
  enforceStateRules();
}

function enforceStateRules() {
  if (!COLOR_GENS.has(current.gen)) {
    current.carView = null;
    current.color = null;
    current.colorCustom = '';
    return;
  }
  if (current.carView === 'neither') {
    current.color = null;
    current.colorCustom = '';
  } else if (!current.color) {
    current.color = 'Black';
  }
}

function escapeAttr(value) {
  return String(value ?? '').replaceAll('&', '&amp;').replaceAll('"', '&quot;').replaceAll('<', '&lt;');
}

function render(reset = false) {
  if (idx >= items.length) {
    document.getElementById('main').innerHTML = `<div class="done-banner">全件レビュー完了しました(${items.length}件)。labels.json をご確認ください。</div>`;
    document.getElementById('progress').textContent = '';
    return;
  }
  const { it, existing } = state();
  if (reset) resetCurrent(existing, it);
  const labeledCount = items.filter((it) => isComplete(labels[it.panoId])).length;
  document.getElementById('progress').textContent = `${labeledCount} / ${items.length} labeled  (#${idx + 1})`;
  const mapsUrl = `https://www.google.com/maps/@?api=1&map_action=pano&pano=${it.panoId}`;
  document.getElementById('meta').innerHTML =
    `${it.panoId} | ${it.date ?? '?'} | ${it.sourceFile ?? ''} | ${it.lat?.toFixed(4)},${it.lon?.toFixed(4)} ` +
    `<a href="${mapsUrl}" target="_blank" rel="noopener" style="color:var(--accent);margin-left:8px;">Google Mapで開く ↗</a>`;

  ensureSkeleton();
  // StreetViewのiframeはtopSection内にあり、reset(=新しい地点に移動した時)以外では
  // 再生成しない。以前はGeneration/Color等どのボタンを押してもmain全体のinnerHTMLを
  // 丸ごと差し替えていたため、iframeのDOMノードごと作り直されて毎回パノラマが
  // リロードされてしまっていた(ラベリング中にじっくり見比べたいのに毎クリックで
  // 再読み込みされるのは使い勝手が悪い)。
  if (reset) renderTop(it);
  renderPanel();

  syncButtons();
  attachHandlers();
}

function ensureSkeleton() {
  if (document.getElementById('topSection')) return;
  document.getElementById('main').innerHTML = `
    <div class="layout">
      <div class="top" id="topSection"></div>
      <div class="panel" id="panelSection"></div>
    </div>
  `;
}

function renderTop(it) {
  const embedHeading = it.headingDeg ?? 0;
  const isGen4Resolution = it.resolutionHeight === 8192;
  const frontYaw = isGen4Resolution ? '0°' : '-20°';
  const backYaw = isGen4Resolution ? '180°' : '120°';
  // The pb embed URL's "!5f" field isn't a raw fov degree value — it's a separate zoom
  // number that maps to fov via fov ≈ -23.59*Z + 93.45. Empirically (screenshot-tested),
  // Z=0 (fov≈93.45°) is already the most zoomed-out state settable through the URL; more
  // negative Z clamps back to the same view. Further zoom-out is only reachable by the
  // viewer's own interactive pinch/scroll, not via any URL parameter.
  const embedUrl = `https://www.google.com/maps/embed?pb=!4v${Date.now()}!6m8!1m7!1s${it.panoId}!2m2!1d${it.lat}!2d${it.lon}!3f${embedHeading}!4f0!5f0`;
  const secondaryViews = COLLECT_WATERMARK
    ? `<div class="secondary-views">
        ${it.images.watermark
          ? `<figure class="watermark"><img src="/${it.images.watermark}"><figcaption>Copyright watermark year</figcaption></figure>`
          : `<figure class="watermark"><figcaption>Watermark not captured — rerun capture-for-labeling</figcaption></figure>`}
      </div>`
    : '';

  document.getElementById('topSection').innerHTML = `
    <div class="images">
      <div class="primary-views">
        <figure><img src="/${it.images.front}"><figcaption>Front (${it.resolutionHeight ?? '?'}px; ${it.resolutionClass ?? 'Unknown'}; yaw: ${frontYaw})</figcaption></figure>
        <figure><img src="/${it.images.back}"><figcaption>Back (${it.resolutionHeight ?? '?'}px; ${it.resolutionClass ?? 'Unknown'}; yaw: ${backYaw})</figcaption></figure>
      </div>
      ${secondaryViews}
    </div>
    <iframe class="streetview-embed" src="${embedUrl}" allowfullscreen loading="lazy"></iframe>
  `;
}

function renderPanel() {
  const showCarView = COLOR_GENS.has(current.gen);
  const showColor = showCarView && current.carView !== 'neither';

  const detailRows = `
        ${showCarView ? `<div class="row">
          <label class="title">Car / blur view</label>
          <div class="opts">${VIEWS.map(([view, label]) => `<button class="opt" data-view="${view}">${label}</button>`).join('')}</div>
        </div>` : ''}
        ${showColor ? `<div class="row" id="colorRow">
          <label class="title">Color</label>
          <div class="opts">${COLORS.map((color) => `<button class="opt" data-color="${color}">${color}</button>`).join('')}</div>
          <input type="text" id="colorCustom" placeholder="自由入力（Otherなど）" value="${escapeAttr(current.colorCustom)}">
        </div>` : ''}`;

  document.getElementById('panelSection').innerHTML = `
    <div class="row">
      <label class="title">Generation</label>
      <div class="opts">${GENS.map((g, i) => `<button class="opt" data-gen="${g}">${g} <kbd>${i + 1}</kbd></button>`).join('')}</div>
    </div>
    ${detailRows}
    <div class="row">
      <label class="title">確信度</label>
      <div class="opts">
        <button class="opt" data-conf="high">High</button>
        <button class="opt" data-conf="low">Low</button>
      </div>
    </div>
    <div class="row">
      <label class="title">メモ</label>
      <input type="text" id="notes" placeholder="任意メモ" value="${escapeAttr(current.notes)}">
    </div>
    <div class="actions">
      <button class="btn-nav" id="prevBtn">◀ Prev</button>
      <button class="btn-skip" id="skipBtn">Skip (S)</button>
      <button class="btn-reject" id="rejectBtn">Reject (X)</button>
      <button class="btn-save" id="saveBtn">Save &amp; Next (Enter)</button>
      <button class="btn-nav" id="nextBtn">Next ▶</button>
    </div>
    <div class="hint">数字キー1-${GENS.length}=世代 / F,B,O,N=車・ブラーの見え方 / Enter=保存して次へ / S=スキップ / X=Reject / ←→=移動</div>
  `;
}

function setGen(g) {
  current.gen = g;
  if (g === 'Gen4' && !current.carView) current.carView = 'front';
  enforceStateRules();
  render(false);
}

function syncButtons() {
  document.querySelectorAll('[data-gen]').forEach(b => b.classList.toggle('selected', b.dataset.gen === current.gen));
  document.querySelectorAll('[data-view]').forEach(b => b.classList.toggle('selected', b.dataset.view === current.carView));
  document.querySelectorAll('[data-color]').forEach(b => b.classList.toggle('selected', b.dataset.color === current.color));
  document.querySelectorAll('[data-conf]').forEach(b => b.classList.toggle('selected', b.dataset.conf === current.confidence));
  const colorCustomEl = document.getElementById('colorCustom');
  if (colorCustomEl) colorCustomEl.value = current.colorCustom;
}

function attachHandlers() {
  document.querySelectorAll('[data-gen]').forEach(b => b.onclick = () => setGen(b.dataset.gen));
  document.querySelectorAll('[data-view]').forEach(b => b.onclick = () => {
    current.carView = b.dataset.view;
    enforceStateRules();
    render(false);
  });
  document.querySelectorAll('[data-color]').forEach(b => b.onclick = () => { current.color = b.dataset.color; syncButtons(); });
  document.querySelectorAll('[data-conf]').forEach(b => b.onclick = () => { current.confidence = b.dataset.conf; syncButtons(); });
  const colorCustom = document.getElementById('colorCustom');
  if (colorCustom) colorCustom.oninput = (e) => current.colorCustom = e.target.value;
  document.getElementById('notes').oninput = (e) => current.notes = e.target.value;
  document.getElementById('saveBtn').onclick = save;
  document.getElementById('skipBtn').onclick = skip;
  document.getElementById('rejectBtn').onclick = reject;
  document.getElementById('prevBtn').onclick = () => { idx = Math.max(0, idx - 1); render(true); };
  document.getElementById('nextBtn').onclick = () => { idx = Math.min(items.length, idx + 1); render(true); };
}

async function save() {
  const it = items[idx];
  if (!current.gen) return alert('世代を選択してください。');
  const payload = {
    panoId: it.panoId,
    gen: current.gen,
    confidence: current.confidence,
    notes: current.notes,
  };
  if (COLOR_GENS.has(current.gen)) {
    if (!current.carView) return alert('車体およびブラーの見え方を選択してください。');
    payload.carView = current.carView;
    payload.color = current.carView === 'neither' ? null : current.color;
    payload.colorCustom = payload.color ? current.colorCustom : '';
  }
  const response = await fetch('/api/label', { method: 'POST', body: JSON.stringify(payload) });
  if (!response.ok) {
    const result = await response.json();
    return alert(`保存できません: ${result.error ?? response.status}`);
  }
  labels[it.panoId] = payload;
  idx++;
  render(true);
}

async function skip() {
  const it = items[idx];
  await fetch('/api/label', { method: 'POST', body: JSON.stringify({ panoId: it.panoId, skip: true }) });
  labels[it.panoId] = { skipped: true };
  idx++;
  render(true);
}

async function reject() {
  const it = items[idx];
  const reason = current.notes || '';
  await fetch('/api/label', { method: 'POST', body: JSON.stringify({ panoId: it.panoId, reject: true, reason }) });
  labels[it.panoId] = { rejected: true, reason };
  idx++;
  render(true);
}

document.addEventListener('keydown', (e) => {
  if (document.activeElement.tagName === 'INPUT') {
    if (e.key === 'Enter') { e.target.blur(); }
    return;
  }
  if (idx >= items.length) return;
  if (/^[1-9]$/.test(e.key) && parseInt(e.key) <= GENS.length) { setGen(GENS[parseInt(e.key) - 1]); }
  else if (e.key.toLowerCase() === 'f' && COLOR_GENS.has(current.gen)) { current.carView = 'front'; enforceStateRules(); render(false); }
  else if (e.key.toLowerCase() === 'b' && COLOR_GENS.has(current.gen)) { current.carView = 'back'; enforceStateRules(); render(false); }
  else if (e.key.toLowerCase() === 'o' && COLOR_GENS.has(current.gen)) { current.carView = 'both'; enforceStateRules(); render(false); }
  else if (e.key.toLowerCase() === 'n' && COLOR_GENS.has(current.gen)) { current.carView = 'neither'; enforceStateRules(); render(false); }
  else if (e.key.toLowerCase() === 's') { skip(); }
  else if (e.key.toLowerCase() === 'x') { reject(); }
  else if (e.key === 'Enter') { save(); }
  else if (e.key === 'ArrowLeft') { idx = Math.max(0, idx - 1); render(true); }
  else if (e.key === 'ArrowRight') { idx = Math.min(items.length, idx + 1); render(true); }
});

load();
</script>
</body>
</html>
